[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-integration-engine"
version = "0.1.0"
description = "Production-ready integration orchestrator for autonomous AI governance systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Senpai-Sama7", email = "douglas@reliantai.dev" }]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    
    # Async
    "asyncio-contextmanager>=1.0",
    "aiohttp>=3.9",
    "httpx>=0.25",
    
    # Web
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "websockets>=11.0",
    
    # Database & State
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    
    # Logging & Observability
    "structlog>=23.2",
    "python-json-logger>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    
    # Testing
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    
    # CLI
    "click>=8.1",
    "typer>=0.9",
    "rich>=13.7",
    
    # MCP
    "mcp>=0.1",
]

optional-dependencies = {
    dev = [
        "black>=23.12",
        "ruff>=0.1",
        "mypy>=1.7",
        "pre-commit>=3.6",
    ],
    full = [
        "docker>=7.0",
        "kubernetes>=28.0",
        "prometheus-client>=0.19",
    ],
}

[tool.setuptools]
packages = ["stack_integration"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=stack_integration --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
