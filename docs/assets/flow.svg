<text x="24" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Otherwise the run is <tspan fill="#f85149" font-weight="600">BLOCKED</tspan> and nothing is integrated. Success publishes <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#c9d1d9">refs/heads/stack-agent/&lt;run&gt;</tspan>; your branch is never touched.</text>
