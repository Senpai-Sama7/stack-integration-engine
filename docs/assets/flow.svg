<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 540" width="1088" height="540" role="img" aria-labelledby="t d">
<title id="t">Run lifecycle</title>
<desc id="d">Swimlane diagram. The operator plans a run. The controller leases a task and a worktree to a builder provider, freezes the candidate hash, and asks the opposite provider to review it. A verifier runs independent checks. The controller integrates only when the candidate is approved, covers every requirement, passes its checks, and is unchanged. A failed gate blocks the run and integrates nothing.</desc>
